<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Life · Photo manager</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0c0a0f;
        color: #ededed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        max-width: 1400px;
        padding: 24px;
        margin: auto;
      }
      h1 {
        color: #e0d4f4;
        margin-bottom: 8px;
      }
      p {
        color: #b8afc4;
        line-height: 1.6;
      }
      a {
        color: #c4b5fd;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        border: 1px solid #44364f;
        border-radius: 8px;
        padding: 9px;
        background: #1b1623;
        color: inherit;
      }
      button,
      select,
      input[type="checkbox"] {
        cursor: pointer;
      }
      button:hover {
        border-color: #c4b5fd;
      }
      :focus-visible {
        outline: 2px solid #c4b5fd;
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding-block: 16px;
        background: #0c0a0ff5;
        border-bottom: 1px solid #302639;
      }
      .save {
        background: #c4b5fd;
        color: #17101f;
        font-weight: 650;
      }
      #status {
        flex: 1;
        min-width: 180px;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr));
        gap: 20px;
        padding-block: 20px;
      }
      article {
        border: 1px solid #302639;
        border-radius: 12px;
        overflow: hidden;
        background: #141018;
      }
      .image-button {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 0;
        padding: 0;
        background: #09070c;
      }
      article img {
        display: block;
        width: 100%;
        height: 230px;
        object-fit: contain;
      }
      .fields {
        display: grid;
        gap: 12px;
        padding: 16px;
      }
      .filename {
        font-size: 12px;
        overflow-wrap: anywhere;
        color: #a99eb6;
      }
      label {
        display: grid;
        gap: 5px;
        font-size: 14px;
      }
      .visibility {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      textarea {
        width: 100%;
        min-height: 65px;
        resize: vertical;
      }
      .order-row {
        display: flex;
        align-items: end;
        gap: 8px;
      }
      .order-row label {
        flex: 1;
        min-width: 0;
      }
      input[type="number"] {
        width: 100%;
      }
      [hidden] {
        display: none !important;
      }
      dialog {
        width: min(1000px, 94vw);
        max-height: 94dvh;
        padding: 16px;
        background: #141018;
        color: #ededed;
        border: 1px solid #755592;
        border-radius: 12px;
      }
      dialog::backdrop {
        background: #000b;
      }
      dialog img {
        display: block;
        width: 100%;
        max-height: 76dvh;
        object-fit: contain;
        margin-block: 12px;
      }
      #warning {
        color: #f1bd87;
      }
      @media (width < 600px) {
        body {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <p>LOCAL PHOTO STUDIO</p>
      <h1>Life, in pictures.</h1>
      <p>
        给照片选分类、写说明，再点“保存全部”。未分类或勾选隐藏的照片不会展示。顺序数字越小越靠前；点击照片可放大。
      </p>
    </header>
    <div class="toolbar">
      <label
        >查看分类
        <select id="filter">
          <option value="all">全部照片</option>
          <option value="unassigned">未分类</option>
          <option value="hidden">已隐藏</option>
        </select></label
      >
      <button type="button" class="save" id="save">保存全部</button>
      <button type="button" id="reload">重新扫描文件夹</button>
      <a href="http://localhost:4321/life" target="_blank" rel="noopener"
        >预览网站 ↗</a
      >
      <span id="status" role="status" aria-live="polite">正在读取照片…</span>
    </div>
    <p id="warning" hidden></p>
    <main id="grid" aria-label="照片管理"></main>
    <dialog id="viewer" aria-label="照片大图">
      <button type="button" id="close-viewer">关闭 ×</button>
      <img id="large-image" alt="">
    </dialog>
    <template id="card">
      <article>
        <button type="button" class="image-button">
          <img loading="lazy" alt="">
        </button>
        <div class="fields">
          <span class="filename"></span>
          <label
            >分类
            <select data-field="category">
              <option value="">未分类（不展示）</option>
            </select></label
          >
          <label
            >照片说明
            <textarea
              data-field="caption"
              maxlength="500"
              placeholder="可选：地点、日期，或一句回忆"
            ></textarea></label
          >
          <label
            >图片描述（alt text）
            <input
              data-field="alt"
              maxlength="500"
              placeholder="简短描述画面，方便屏幕阅读器使用"
            ></label
          >
          <div class="order-row">
            <label
              >展示顺序
              <input
                data-field="order"
                type="number"
                min="0"
                max="100000"
                step="1"
              ></label
            ><button type="button" data-move="-1" title="在当前分类中上移">
              ↑
            </button><button
              type="button"
              data-move="1"
              title="在当前分类中下移"
            >
              ↓
            </button>
          </div>
          <label class="visibility"
            ><input data-field="hidden" type="checkbox">暂时隐藏</label
          >
        </div>
      </article>
    </template>
    <script>
      const grid = document.querySelector("#grid")
      const filter = document.querySelector("#filter")
      const status = document.querySelector("#status")
      const save = document.querySelector("#save")
      const viewer = document.querySelector("#viewer")
      let photos = []
      let categories = []
      let dirty = false

      function markDirty() {
        dirty = true
        status.textContent = "有未保存的修改"
      }
      function applyFilter() {
        let visible = 0
        for (const card of grid.children) {
          const photo = photos.find((item) => item.id === card.dataset.id)
          const match =
            filter.value === "all" ||
            (filter.value === "unassigned"
              ? !photo.category
              : filter.value === "hidden"
                ? photo.hidden
                : photo.category === filter.value)
          card.hidden = !match
          if (match) visible++
        }
        filter.setAttribute("aria-label", `查看分类，当前 ${visible} 张照片`)
      }
      function render() {
        grid.replaceChildren()
        for (const photo of [...photos].sort(
          (a, b) => a.order - b.order || a.file.localeCompare(b.file),
        )) {
          const card = document
            .querySelector("#card")
            .content.firstElementChild.cloneNode(true)
          card.dataset.id = photo.id
          card.querySelector(".filename").textContent = photo.file
          const image = card.querySelector("img")
          image.src = `/image/${photo.id}`
          image.alt = photo.alt || photo.caption || photo.file
          const button = card.querySelector(".image-button")
          button.setAttribute("aria-label", `放大 ${photo.file}`)
          button.addEventListener("click", () => {
            const large = document.querySelector("#large-image")
            large.src = `/image/${photo.id}?large=1`
            large.alt = photo.alt || photo.caption || photo.file
            viewer.showModal()
          })
          const categorySelect = card.querySelector('[data-field="category"]')
          for (const category of categories)
            categorySelect.add(new Option(category.label, category.id))
          for (const input of card.querySelectorAll("[data-field]")) {
            const field = input.dataset.field
            if (field === "hidden") input.checked = photo.hidden
            else input.value = photo[field] ?? ""
            input.addEventListener("input", () => {
              if (field === "order" && !input.checkValidity()) {
                markDirty()
                return
              }
              photo[field] =
                field === "hidden"
                  ? input.checked
                  : field === "order"
                    ? Number(input.value)
                    : input.value || (field === "category" ? null : "")
              markDirty()
              if (field === "category" || field === "hidden") applyFilter()
            })
            if (field === "order")
              input.addEventListener("change", () => {
                if (input.checkValidity()) render()
              })
          }
          for (const move of card.querySelectorAll("[data-move]"))
            move.addEventListener("click", () => {
              const group = photos
                .filter((item) => item.category === photo.category)
                .sort(
                  (a, b) => a.order - b.order || a.file.localeCompare(b.file),
                )
              const index = group.indexOf(photo)
              const target = index + Number(move.dataset.move)
              if (target < 0 || target >= group.length) return
              ;[group[index], group[target]] = [group[target], group[index]]
              group.forEach((item, i) => {
                item.order = i
              })
              markDirty()
              render()
              grid
                .querySelector(
                  `[data-id="${photo.id}"] [data-move="${move.dataset.move}"]`,
                )
                .focus()
            })
          grid.append(card)
        }
        applyFilter()
      }
      async function load() {
        if (dirty && !confirm("重新扫描会放弃未保存的修改，继续吗？")) return
        try {
          const response = await fetch("/api/photos")
          const data = await response.json()
          if (!response.ok) throw new Error(data.error)
          photos = data.photos
          categories = data.categories
          filter
            .querySelectorAll("[data-category]")
            .forEach((item) => item.remove())
          for (const category of categories) {
            const option = new Option(category.label, category.id)
            option.dataset.category = "true"
            filter.add(option)
          }
          const warning = document.querySelector("#warning")
          warning.hidden = data.missing.length === 0
          warning.textContent = `这些已保存的文件不在照片文件夹中，保存时将移除其记录：${data.missing.join("、")}`
          dirty = false
          render()
          status.textContent = `已读取 ${photos.length} 张照片`
        } catch (error) {
          status.textContent = `读取失败：${error.message}`
        }
      }
      save.addEventListener("click", async () => {
        const invalid = grid.querySelector("input:invalid")
        if (invalid) {
          status.textContent = "展示顺序需要是 0–100000 的整数"
          invalid.reportValidity()
          return
        }
        save.disabled = true
        grid.inert = true
        document.querySelector("#reload").disabled = true
        status.textContent = "保存并生成网站图片中…"
        try {
          const response = await fetch("/api/gallery", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              version: 1,
              photos: photos.map(({ id, ...photo }) => photo),
            }),
          })
          const result = await response.json()
          if (!response.ok) throw new Error(result.error)
          dirty = false
          status.textContent = `已保存 ${result.saved} 张照片的设置，刷新网站预览即可`
        } catch (error) {
          status.textContent = `保存失败：${error.message}`
        } finally {
          save.disabled = false
          grid.inert = false
          document.querySelector("#reload").disabled = false
        }
      })
      filter.addEventListener("change", applyFilter)
      document.querySelector("#reload").addEventListener("click", load)
      document
        .querySelector("#close-viewer")
        .addEventListener("click", () => viewer.close())
      window.addEventListener("beforeunload", (event) => {
        if (dirty) {
          event.preventDefault()
          event.returnValue = ""
        }
      })
      load()
    </script>
  </body>
</html>
